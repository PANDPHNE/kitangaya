<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitang Aya Phoneshop · Available units</title>
<meta name="description" content="Available second-hand flagship phones at Kitang Aya Phoneshop. Updated every hour.">
<meta property="og:title" content="Kitang Aya Phoneshop · Available units"><meta property="og:description" content="Murang flagship · updated every hour">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Onest,system-ui,sans-serif;background:#F6F1EA;color:#1D2A24;font-size:15px}
header{background:#0B3D2E;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;max-width:1300px;margin:0 auto}
header h1{margin:0;font-size:19px;color:#B9F227}header .sub{font-size:12.5px;opacity:.8}
.bar{max-width:1300px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.bar input,.bar select{font:inherit;font-size:14px;padding:9px 11px;border-radius:10px;border:0;background:#fff;color:#1D2A24}
.bar input{flex:1 1 220px}.bar select{flex:0 0 auto}
.chips{max-width:1300px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button.on{background:#B9F227;color:#0B3D2E;border-color:#B9F227}
main{max-width:1300px;margin:0 auto;padding:14px}
.count{color:#5B6660;font-size:13px;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.it{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;display:flex;flex-direction:column}
.it canvas,.it .ph{width:100%;aspect-ratio:1/1;display:block;background:#E9E3D9}
.it .ph{display:flex;align-items:center;justify-content:center;color:#8A928D;font-size:13px;text-align:center;padding:16px;background:#0B3D2E;color:#E9F5D0;flex-direction:column;gap:6px}
.it .ph b{font-family:'Courier Prime',monospace;font-size:20px;letter-spacing:.12em}
.it .tx{padding:9px 11px 11px;font-size:13px;line-height:1.35}.it .tx b{display:block}.it .pr{color:#0B3D2E;font-weight:700;font-size:15px;margin-top:3px}
.empty{padding:40px;text-align:center;color:#6B756F}
footer{text-align:center;color:#6B756F;font-size:12.5px;padding:26px 14px 40px}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cta a{flex:1 1 140px;text-align:center;text-decoration:none;font-weight:700;font-size:14px;border-radius:11px;padding:11px 12px}
.cta .m{background:#B9F227;color:#0B3D2E}.cta .o{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<header><div class="row1"><h1>Kitang Aya Phoneshop</h1><span class="sub" id="sub">Loading available units…</span></div>
<div class="bar"><input id="q" type="search" placeholder="Search model or code (e.g. S23 Ultra, KA10070)" autocomplete="off">
<select id="pr"><option value="">Any price</option><option value="0-5000">Up to ₱5,000</option><option value="5000-10000">₱5,000 – 10,000</option><option value="10000-20000">₱10,000 – 20,000</option><option value="20000-35000">₱20,000 – 35,000</option><option value="35000-">₱35,000 and up</option></select>
<select id="cn"><option value="">Any condition</option><option value="ok">No issue</option><option value="iss">With issues (mamaw sa specs)</option></select>
<select id="so"><option value="new">Newest first</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div>
<div class="chips" id="br"></div></header>
<main><div class="count" id="cnt"></div><div class="grid" id="grid"></div><div class="empty hide" id="none" style="display:none">No units match. Try another search.</div></main>
<footer id="ft"></footer>
<script src="config.js"></script><script src="kp-common.js"></script><script src="app.js"></script>
</body></html>
